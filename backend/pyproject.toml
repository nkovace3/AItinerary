dependencies = [
    "alembic>=1.20.0",
    "apscheduler>=3.11.3",
    "beautifulsoup4>=4.15.0",
    "fastapi[standard]>=0.141.1",
    "feedparser>=6.0.14",
    "google-genai>=2.23.0",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.13.5",
